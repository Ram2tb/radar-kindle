<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar E-ink</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }
        body {
            /* Prefijos para navegadores viejos (Kindle) */
            -webkit-transform: rotate(90deg);
            transform: rotate(90deg);
            -webkit-transform-origin: top left;
            transform-origin: top left;
            width: 100vh;
            height: 100vw;
            position: absolute;
            top: 0;
            left: 100vw;
            
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            
            text-align: center;
            box-sizing: border-box;
            padding: 4vh;
        }
        .hidden { display: none !important; }
        
        #status-bar {
            position: absolute;
            top: 4vh;
            right: 4vh;
            font-size: 4vh;
            font-weight: bold;
        }
        
        #clear-sky-title {
            font-size: 15vh;
            font-weight: bold;
            margin-bottom: 2vh;
        }
        #clear-sky-subtitle {
            font-size: 6vh;
        }
        
        #callsign {
            font-size: 22vh;
            font-weight: bold;
            margin: 0;
            line-height: 1;
        }
        #airline {
            font-size: 7vh;
            margin-top: 1vh;
            margin-bottom: 8vh;
        }
        .data-grid {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            
            -webkit-justify-content: space-around;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 2vh;
        }
        .data-item {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            
            -webkit-box-orient: vertical;
            -webkit-flex-direction: column;
            flex-direction: column;
            
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
        }
        .data-label {
            font-size: 3.5vh;
            text-transform: uppercase;
        }
        .data-value {
            font-size: 7vh;
            font-weight: bold;
        }
        #track-arrow {
            font-size: 18vh;
            line-height: 1;
            margin-top: 2vh;
        }
    </style>
</head>
<body>

    <div id="status-bar">INICIANDO...</div>

    <!-- Vista Cielo Despejado -->
    <div id="view-clearsky" class="hidden">
        <div id="clear-sky-title">CIELO DESPEJADO</div>
        <div id="clear-sky-subtitle">Próximo vuelo a <span id="next-dist">--</span> km</div>
    </div>

    <!-- Vista Dashboard Vuelo -->
    <div id="view-flight" class="hidden">
        <div id="callsign">---</div>
        <div id="airline">---</div>
        <div class="data-grid">
            <div class="data-item">
                <span class="data-label">Altitud</span>
                <span class="data-value" id="alt">-- m</span>
            </div>
            <div class="data-item">
                <span class="data-label">Velocidad</span>
                <span class="data-value" id="spd">-- km/h</span>
            </div>
            <div class="data-item">
                <span class="data-label">Distancia</span>
                <span class="data-value" id="dist">-- km</span>
            </div>
        </div>
        <div id="track-arrow">↑</div>
    </div>

    <script>
        // Usamos variables al estilo antiguo para máxima compatibilidad
        var USER_LAT = -34.53;
        var USER_LON = -58.49;
        var API_URL = '/api/vuelos';

        var statusBar = document.getElementById('status-bar');
        var viewClearSky = document.getElementById('view-clearsky');
        var viewFlight = document.getElementById('view-flight');

        var nextDistEl = document.getElementById('next-dist');
        var callsignEl = document.getElementById('callsign');
        var airlineEl = document.getElementById('airline');
        var altEl = document.getElementById('alt');
        var spdEl = document.getElementById('spd');
        var distEl = document.getElementById('dist');
        var trackArrowEl = document.getElementById('track-arrow');

        var airlines = {
            'ARG': 'Aerolíneas Argentinas',
            'FBZ': 'Flybondi',
            'AVA': 'Avianca',
            'JSM': 'JetSMART',
            'LAN': 'LATAM Airlines',
            'GLO': 'GOL Linhas Aéreas',
            'AAL': 'American Airlines',
            'DAL': 'Delta Air Lines',
            'UAL': 'United Airlines',
            'IBE': 'Iberia',
            'LPE': 'LATAM Perú',
            'DSM': 'LADE',
            'CMP': 'Copa Airlines',
            'AZU': 'Azul Linhas Aéreas',
            'BOV': 'Boliviana de Aviación',
            'SKU': 'Sky Airline'
        };

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function getDirectionArrow(degrees) {
            if (degrees === null || degrees === undefined) return '';
            var arrows = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖', '↑'];
            var index = Math.round((degrees % 360) / 45);
            return arrows[index];
        }

        function getAirline(callsign) {
            if (!callsign) return 'VUELO NO IDENTIFICADO';
            var clean = callsign.trim();
            var code3 = clean.substring(0, 3).toUpperCase();
            return airlines[code3] || 'VUELO COMERCIAL';
        }

        // Reemplazamos Fetch y Async/Await por el viejo y confiable XMLHttpRequest
        function fetchData() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', API_URL, true);
            
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        statusBar.innerText = '';
                        
                        if (!data || !data.ac || data.ac.length === 0) {
                            showClearSky('--');
                            return;
                        }

                        var closestFlight = null;
                        var minDistance = Infinity;

                        for (var i = 0; i < data.ac.length; i++) {
                            var plane = data.ac[i];
                            if (plane.lat && plane.lon) {
                                var dist = getHaversineDistance(USER_LAT, USER_LON, plane.lat, plane.lon);
                                if (dist < minDistance) {
                                    minDistance = dist;
                                    closestFlight = plane;
                                }
                            }
                        }

                        if (closestFlight) {
                            if (minDistance < 20) {
                                showFlight(closestFlight, minDistance);
                            } else {
                                showClearSky(minDistance.toFixed(1));
                            }
                        } else {
                            showClearSky('--');
                        }
                    } catch (e) {
                        statusBar.innerText = 'ERROR DE DATOS';
                    }
                } else {
                    statusBar.innerText = 'RECONECTANDO...';
                }
            };

            xhr.onerror = function() {
                statusBar.innerText = 'RECONECTANDO...';
            };

            xhr.send();
        }

        function showClearSky(distance) {
            viewFlight.className = 'hidden';
            viewClearSky.className = '';
            nextDistEl.innerText = distance;
        }

        function showFlight(plane, distance) {
            viewClearSky.className = 'hidden';
            viewFlight.className = '';

            var callsign = (plane.flight || '---').trim();
            var altFt = plane.alt_baro || plane.alt_geom;
            var alt = altFt ? (altFt <= 0 ? 'En tierra' : Math.round(altFt * 0.3048) + ' m') : '---';
            var spd = plane.gs ? Math.round(plane.gs * 1.852) + ' km/h' : '---';
            var track = plane.track;

            callsignEl.innerText = callsign;
            airlineEl.innerText = getAirline(callsign);
            altEl.innerText = alt;
            spdEl.innerText = spd;
            distEl.innerText = distance.toFixed(1) + ' km';
            trackArrowEl.innerText = getDirectionArrow(track);
        }

        // Arrancamos!
        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
