<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Test de Fuentes</title>
    <style>
        html, body { 
            width: 100%; height: 100%; margin: 0; padding: 0; 
            background: #FFF; color: #000; overflow: hidden; 
        }
        
        /* Mantenemos la rotación para que no tengas que torcer el cuello */
        #screen {
            width: 720px; 
            height: 580px;
            position: absolute;
            top: 0;
            left: 600px;
            -webkit-transform: rotate(90deg);
            -webkit-transform-origin: 0 0;
            padding: 40px;
            box-sizing: border-box;
            text-align: left;
        }

        .title { font-family: sans-serif; font-size: 40px; font-weight: bold; margin-bottom: 40px; border-bottom: 2px solid #000; }
        
        /* Filas de prueba */
        .test-row { font-size: 55px; margin-bottom: 30px; white-space: nowrap; }
        .label { font-size: 20px; display: inline-block; width: 150px; vertical-align: middle; font-family: sans-serif; color: #666; }
    </style>
</head>
<body>
    <div id="screen">
        <div class="title">TEST DE ÍCONOS UNICODE</div>

        <div class="test-row">
            <span class="label">Sans-Serif<br>(Actual)</span>
            <span style="font-family: sans-serif;">✈ ☀ ☁ ☂ ⚡</span>
        </div>

        <div class="test-row">
            <span class="label">Serif<br>(Clásica)</span>
            <span style="font-family: serif;">✈ ☀ ☁ ☂ ⚡</span>
        </div>

        <div class="test-row">
            <span class="label">Bookerly<br>(E-reader)</span>
            <span style="font-family: 'Bookerly', serif;">✈ ☀ ☁ ☂ ⚡</span>
        </div>

        <div class="test-row">
            <span class="label">Monospace<br>(Máquina)</span>
            <span style="font-family: monospace;">✈ ☀ ☁ ☂ ⚡</span>
        </div>
        
        <div class="test-row">
            <span class="label">Arial<br>(Básica)</span>
            <span style="font-family: Arial, sans-serif;">✈ ☀ ☁ ☂ ⚡</span>
        </div>
    </div>
</body>
</html>
