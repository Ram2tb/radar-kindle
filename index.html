<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Radar & Weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html { overflow: hidden !important; margin: 0; padding: 0; background: #FFF; }
        body {
            width: 720px; 
            height: 580px;
            margin: 0; padding: 0;
            background-color: #FFFFFF; color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            position: absolute; top: 0; left: 600px;
            -webkit-transform: rotate(90deg); -webkit-transform-origin: 0 0;
            text-align: center; overflow: hidden;
        }
        #debug { position: absolute; top: 0; left: 0; font-size: 14px; color: #000; padding: 5px; z-index: 10; display: none; }
        .hidden { display: none !important; }
        .box { box-sizing: border-box; width: 100%; }
        
        .title-container { white-space: normal; width: 100%; padding: 0 20px; box-sizing: border-box; }
        .arrow { font-size: 60px; display: inline-block; vertical-align: middle; margin-left: 15px; }
        
        .big { font-size: 38px; margin: 5px 0; font-weight: bold; display: inline-block; vertical-align: middle; }
        
        .data-container { margin-top: 20px; width: 94%; margin-left: 3%; white-space: nowrap; }
        .med { display: inline-block; width: 31%; font-size: 18px; vertical-align: top; color: #333; font-weight: bold; line-height: 1; }
        .med b { font-size: 38px; display: block; margin-top: 5px; color: #000; line-height: 1; }
        .med-sep { display: inline-block; width: 2%; font-size: 30px; color: #ccc; vertical-align: middle; }
        
        .bottom-container { margin-top: 25px; width: 94%; margin-left: 3%; white-space: nowrap; border-top: 2px solid #000; padding-top: 15px; }
        .bottom-item { display: inline-block; width: 48%; vertical-align: top; }
        .bottom-label { font-size: 22px; color: #333; letter-spacing: 2px; font-weight: bold; line-height: 1; }
        .bottom-value { font-size: 55px; font-weight: bold; margin-top: 5px; color: #000; line-height: 1; }
        .weather-display { font-weight: normal; margin-left: 5px; color: #333; }
        .weather-display i { font-size: 45px; vertical-align: middle; }
    </style>
</head>
<body>
    <div id="debug"></div>

    <!-- BOTÓN TOGGLE SPOTIFY FIJO (Arriba a la Izquierda) -->
    <div id="spotify-toggle" onclick="toggleSpotify()" style="position: absolute; top: 12px; left: 15px; z-index: 1000; font-size: 32px; color: #888; cursor: pointer;">
        <i class="fa-brands fa-spotify"></i>
    </div>

    <!-- BANNER DINÁMICO TREN DE LA COSTA -->
    <div id="train-banner" class="hidden" style="width: 100%; background: #000; color: #FFF; padding: 10px 0; border-bottom: 4px solid #333; z-index: 100;">
        <div style="font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #CCC; line-height: 1; padding-left: 60px;">
            <i class="fa-solid fa-train-tram"></i> PRÓXIMO TREN A TIGRE
        </div>
        <div style="font-size: 55px; font-weight: bold; margin-top: 5px; line-height: 1; padding-left: 60px;" id="train-time">
            ESTADO: <span id="train-status-text" style="font-size: 45px; font-weight: normal; color: #FFF; vertical-align: middle;">BUSCANDO...</span>
        </div>
    </div>

    <!-- BANNER SPOTIFY (Ahora empuja hacia abajo y tiene botones proporcionados) -->
    <div id="spotify-banner" class="hidden" style="width: 100%; background: #000; color: #FFF; padding: 12px 0 15px 0; border-bottom: 4px solid #333; z-index: 90;">
        <div style="font-size: 28px; font-weight: bold; margin-bottom: 2px; line-height: 1.1; white-space: normal; padding: 0 20px 0 60px;">
            <span id="sp-title">Buscando...</span>
        </div>
        <div style="font-size: 20px; color: #CCC; line-height: 1; white-space: normal; padding: 0 20px 0 60px;" id="sp-artist">---</div>
        
        <div style="margin-top: 15px; width: 100%; text-align: center;">
            <span onclick="sendSpCmd('previous')" style="display: inline-block; width: 22%; font-size: 35px; cursor: pointer; color: #FFF;"><i class="fa-solid fa-backward-step"></i></span>
            <span onclick="sendSpCmd('play')" style="display: inline-block; width: 22%; font-size: 35px; cursor: pointer; color: #FFF;"><i class="fa-solid fa-play"></i></span>
            <span onclick="sendSpCmd('pause')" style="display: inline-block; width: 22%; font-size: 35px; cursor: pointer; color: #FFF;"><i class="fa-solid fa-pause"></i></span>
            <span onclick="sendSpCmd('next')" style="display: inline-block; width: 22%; font-size: 35px; cursor: pointer; color: #FFF;"><i class="fa-solid fa-forward-step"></i></span>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL: RELOJ Y METEOROLOGÍA -->
    <div id="view-idle" class="hidden box">
        <div id="idle-spacer" style="height: 170px;"></div>
        <div style="font-size: 130px; font-weight: bold; letter-spacing: -2px; line-height: 1;" class="clock-display">00<span class="clock-sep" style="opacity: 1;">:</span>00</div>
        
        <div style="font-size: 60px; margin-top: 25px; line-height: 1;">
            <span id="wx-icon"><i class="fa-solid fa-sun"></i></span>
            <span id="wx-temp" style="margin-left: 15px; font-weight: bold;">--°</span>
        </div>

        <div class="data-container" style="margin-top: 45px; border-top: 2px solid #000; padding-top: 20px;">
            <div class="med" style="width: 30%;">WIND <i class="fa-solid fa-wind"></i><b id="wx-wind">-- km/h</b></div>
            <span class="med-sep">|</span>
            <div class="med" style="width: 30%;">HUMIDITY <i class="fa-solid fa-droplet"></i><b id="wx-hum">--%</b></div>
            <span class="med-sep">|</span>
            <div class="med" style="width: 30%;">RAIN <i class="fa-solid fa-umbrella"></i><b id="wx-pop">--%</b></div>
        </div>
    </div>

    <!-- PANTALLA ALERTA: VUELO DETECTADO -->
    <div id="view-flight" class="hidden box">
        <div id="flight-spacer" style="height: 140px;"></div>
        <div class="title-container" style="line-height: 1;">
            <span id="airline" style="font-size: 52px; font-weight: bold; display: inline-block; vertical-align: middle; max-width: 80%; line-height: 1.1;">---</span>
            <span id="track-arrow" class="arrow"><i class="fa-solid fa-arrow-up"></i></span>
        </div>
        
        <div style="margin: 5px 0 15px 0;">
            <div id="callsign-display" class="big" style="color: #333;">---</div>
            <div id="route-display" class="big" style="color: #333; margin-left: 15px;"></div>
        </div>
        
        <div class="data-container">
            <div class="med">ALTITUDE<b id="alt">--</b></div>
            <span class="med-sep">|</span>
            <div class="med">SPEED<b id="spd">--</b></div>
            <span class="med-sep">|</span>
            <div class="med">DISTANCE<b id="dist">--</b></div>
        </div>

        <div class="bottom-container">
            <div class="bottom-item">
                <div class="bottom-label">LOCAL & WX</div>
                <div class="bottom-value">
                    <span class="clock-display">00<span class="clock-sep" style="opacity: 1;">:</span>00</span><span class="weather-display" id="wx-flight"></span>
                </div>
            </div>
            <div class="bottom-item">
                <div class="bottom-label">ETA (OVERHEAD)</div>
                <div id="eta" class="bottom-value">--</div>
            </div>
        </div>
    </div>

    <script>
        var MODO_PRUEBA_TREN = false; 
        var TREN_ACTIVO = false; 
        
        // Variables de estado Spotify
        var spotifyPauseTimer = null;
        var spotifyForceShow = false;
        var lastSpotifyData = { title: 'Modo Remoto Listo', artist: 'Esperando reproducción...', isPlaying: false };

        var USER_LAT = -34.53;
        var USER_LON = -58.49;
        
        var RADAR_API_URL = '/api/vuelos';
        var WEATHER_API_URL = 'https://api.open-meteo.com/v1/forecast?latitude=' + USER_LAT + '&longitude=' + USER_LON + '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=precipitation_probability_max&timezone=America%2FArgentina%2FBuenos_Aires';

        var viewIdle = document.getElementById('view-idle');
        var viewFlight = document.getElementById('view-flight');

        var airlineEl = document.getElementById('airline');
        var callsignDisplayEl = document.getElementById('callsign-display');
        var routeDisplayEl = document.getElementById('route-display');
        var altEl = document.getElementById('alt');
        var spdEl = document.getElementById('spd');
        var distEl = document.getElementById('dist');
        var trackArrowEl = document.getElementById('track-arrow');
        var etaEl = document.getElementById('eta');

        var previousDistances = {};
        var planeStates = {}; 
        var lastFetchedCallsign = ""; 

        var airlines = {
            'ARG': 'Aerolíneas Argentinas', 'FBZ': 'Flybondi', 'JSM': 'JetSMART', 
            'JES': 'JetSMART', 'JAT': 'JetSMART', 'LAN': 'LATAM Airlines', 
            'LPE': 'LATAM Perú', 'TAM': 'LATAM Brasil', 'LAP': 'LATAM Paraguay', 
            'LCO': 'LATAM Cargo', 'GLO': 'GOL Linhas Aéreas', 'AZU': 'Azul Linhas Aéreas', 
            'SKU': 'Sky Airline', 'SKX': 'Sarpa / Skyway', 'BOV': 'Boliviana de Aviación', 
            'CMP': 'Copa Airlines', 'AVA': 'Avianca', 'LRC': 'Avianca', 'GLG': 'Avianca Ecuador', 
            'DSM': 'LADE', 'DAP': 'Aerovías DAP',
            'AAL': 'American Airlines', 'DAL': 'Delta Air Lines', 'UAL': 'United Airlines', 
            'IBE': 'Iberia', 'AEA': 'Air Europa', 'AFR': 'Air France', 'DLH': 'Lufthansa', 
            'KLM': 'KLM Royal Dutch', 'BWA': 'British Airways', 'ITY': 'ITA Airways', 
            'THY': 'Turkish Airlines', 'ETH': 'Ethiopian Airlines', 'UAE': 'Emirates', 
            'QTR': 'Qatar Airways', 'AMX': 'Aeroméxico', 'ACA': 'Air Canada',
            'FAG': 'Fuerza Aérea Arg.', 'PNA': 'Prefectura Naval', 'PFA': 'Policía Federal', 
            'GNA': 'Gendarmería'
        };

        // Función que empuja el contenido hacia abajo según los banners activos
        function updateLayout() {
            var trainActive = !document.getElementById('train-banner').classList.contains('hidden');
            var spotActive = !document.getElementById('spotify-banner').classList.contains('hidden');
            
            var offset = 0;
            if (trainActive) offset += 95; 
            if (spotActive) offset += 115; 

            var idleTop = 170 - offset;
            var flightTop = 140 - offset;
            
            document.getElementById('idle-spacer').style.height = Math.max(10, idleTop) + 'px';
            document.getElementById('flight-spacer').style.height = Math.max(10, flightTop) + 'px';
        }

        var colonVisible = true;
        function updateClock() {
            var d = new Date();
            var h = d.getUTCHours() - 3;
            if (h < 0) h = h + 24;
            var m = d.getUTCMinutes();
            
            var hoursStr = (h < 10 ? '0' + h : h);
            var minsStr = (m < 10 ? '0' + m : m);
            
            colonVisible = !colonVisible;
            var sepHtml = '<span class="clock-sep" style="opacity: ' + (colonVisible ? '1' : '0') + ';">:</span>';
            var timeHtml = hoursStr + sepHtml + minsStr;
            
            var clocks = document.getElementsByClassName('clock-display');
            for(var i = 0; i < clocks.length; i++) {
                clocks[i].innerHTML = timeHtml;
            }
        }
        setInterval(updateClock, 1000); updateClock();

        function getWeatherIconHtml(code) {
            if (code === 0) return '<i class="fa-solid fa-sun"></i>';
            if (code >= 1 && code <= 3) return '<i class="fa-solid fa-cloud"></i>';
            if (code === 45 || code === 48) return '<i class="fa-solid fa-smog"></i>';
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return '<i class="fa-solid fa-cloud-rain"></i>';
            if ((code >= 71 && code <= 77) || code === 85 || code === 86) return '<i class="fa-solid fa-snowflake"></i>';
            if (code >= 95 && code <= 99) return '<i class="fa-solid fa-cloud-bolt"></i>';
            return '<i class="fa-solid fa-cloud-sun"></i>';
        }

        function fetchWeather() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', WEATHER_API_URL, true);
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        var curr = data.current;
                        
                        var temp = Math.round(curr.temperature_2m) + '°';
                        var hum = Math.round(curr.relative_humidity_2m) + '%';
                        var wind = Math.round(curr.wind_speed_10m) + ' km/h';
                        var pop = data.daily.precipitation_probability_max[0] + '%';
                        var iconHtml = getWeatherIconHtml(curr.weather_code);
                        
                        document.getElementById('wx-icon').innerHTML = iconHtml;
                        document.getElementById('wx-temp').innerText = temp;
                        document.getElementById('wx-hum').innerText = hum;
                        document.getElementById('wx-wind').innerText = wind;
                        document.getElementById('wx-pop').innerText = pop;
                        document.getElementById('wx-flight').innerHTML = ' ' + iconHtml + ' ' + temp;
                    } catch (e) {}
                }
            };
            xhr.send();
        }
        fetchWeather(); setInterval(fetchWeather, 1800000);

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            var dLon = (lon2 - lon1) * Math.PI / 180;
            lat1 = lat1 * Math.PI / 180; lat2 = lat2 * Math.PI / 180;
            var y = Math.sin(dLon) * Math.cos(lat2);
            var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function getDirectionArrowHtml(degrees) {
            if (degrees === null || degrees === undefined) return '<i class="fa-solid fa-arrow-up"></i>';
            var rounded = Math.round((degrees % 360) / 45) * 45;
            return '<i class="fa-solid fa-arrow-up fa-rotate-' + rounded + '"></i>';
        }

        function getAirline(rawCallsign) {
            if (!rawCallsign) return 'PRIVATE';
            var clean = rawCallsign.trim().toUpperCase();
            var code = clean.substring(0, 3);
            
            if (airlines[code]) return airlines[code];
            if (/^[A-Z]{3}\d/.test(clean)) return 'Vuelo Comercial (' + code + ')';
            
            if (clean.startsWith('LV')) return 'Privado (ARG)';
            if (clean.startsWith('LQ')) return 'Estatal (ARG)';
            if (clean.startsWith('PR') || clean.startsWith('PP') || clean.startsWith('PT') || clean.startsWith('PS')) return 'Privado (BRA)';
            if (clean.startsWith('CC')) return 'Privado (CHI)';
            if (clean.startsWith('CX')) return 'Privado (URU)';
            if (clean.startsWith('ZP')) return 'Privado (PAR)';
            if (clean.startsWith('CP')) return 'Privado (BOL)';
            if (clean.startsWith('OB')) return 'Privado (PER)';
            if (clean.startsWith('HC')) return 'Privado (ECU)';
            if (clean.startsWith('HK')) return 'Privado (COL)';
            if (clean.startsWith('YV')) return 'Privado (VEN)';
            if (clean.startsWith('XA') || clean.startsWith('XB') || clean.startsWith('XC')) return 'Privado (MEX)';
            if (clean.startsWith('EC')) return 'Privado (ESP)';
            if (clean.startsWith('EI')) return 'Privado (IRL)';
            if (clean.startsWith('VH')) return 'Privado (AUS)';
            
            if (clean.startsWith('N') && !isNaN(clean.charAt(1))) return 'Privado (EEUU)'; 
            if (clean.startsWith('C') && isNaN(clean.charAt(1))) return 'Privado (CAN)'; 
            if (clean.startsWith('D') && isNaN(clean.charAt(1))) return 'Privado (ALE)'; 
            if (clean.startsWith('G') && isNaN(clean.charAt(1))) return 'Privado (UK)';  
            if (clean.startsWith('F') && isNaN(clean.charAt(1))) return 'Privado (FRA)'; 
            if (clean.startsWith('I') && isNaN(clean.charAt(1))) return 'Privado (ITA)'; 
            
            return 'PRIVATE'; 
        }

        function fetchRadar() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', RADAR_API_URL, true);
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        
                        if (!data || !data.ac || data.ac.length === 0) {
                            showIdle(); return;
                        }

                        var currentDistances = {}, currentStates = {}, closestFlight = null, minDistance = Infinity;
                        
                        for (var i = 0; i < data.ac.length; i++) {
                            var plane = data.ac[i];
                            if (plane.lat && plane.lon) {
                                var dist = getHaversineDistance(USER_LAT, USER_LON, plane.lat, plane.lon);
                                var planeId = (plane.flight || plane.hex || 'UNK').trim();
                                currentDistances[planeId] = dist;
                                
                                var stateObj = planeStates[planeId] || { phase: 'UNKNOWN', graceTicks: 0 };
                                var isApproaching = false;
                                
                                if (previousDistances[planeId] !== undefined) {
                                    if (dist > previousDistances[planeId] + 0.05) {
                                        if (stateObj.phase === 'APPROACHING') { stateObj.phase = 'LEAVING'; stateObj.graceTicks = 8; }
                                        else if (stateObj.phase === 'LEAVING') { if (stateObj.graceTicks > 0) stateObj.graceTicks--; }
                                        else { stateObj.phase = 'LEAVING'; stateObj.graceTicks = 0; }
                                    } else if (dist < previousDistances[planeId] - 0.05) {
                                        stateObj.phase = 'APPROACHING'; isApproaching = true;
                                    }
                                } else { isApproaching = true; }
                                
                                currentStates[planeId] = stateObj;
                                var isPointingToUs = true;
                                if (plane.track !== null && plane.track !== undefined) {
                                    var bearingToUs = getBearing(plane.lat, plane.lon, USER_LAT, USER_LON);
                                    var headingDiff = Math.abs(bearingToUs - plane.track);
                                    if (headingDiff > 180) headingDiff = 360 - headingDiff;
                                    if (headingDiff > 60) isPointingToUs = false;
                                }

                                var spdKmH = plane.gs ? (plane.gs * 1.852) : null;
                                var etaMin = (spdKmH !== null && spdKmH > 20) ? ((dist / spdKmH) * 60) : 999;

                                var isEligible = false;
                                if (isApproaching && isPointingToUs && etaMin <= 5.5) { isEligible = true; } 
                                else if (stateObj.phase === 'LEAVING' && stateObj.graceTicks > 0) { isEligible = true; }

                                if (isEligible && dist < minDistance) { minDistance = dist; closestFlight = plane; }
                            }
                        }
                        
                        previousDistances = currentDistances; planeStates = currentStates; 
                        
                        if (closestFlight) { showFlight(closestFlight, minDistance); } 
                        else { showIdle(); }
                    } catch (e) {}
                } 
            };
            xhr.send();
        }

        function showIdle() {
            viewFlight.className = 'hidden'; viewIdle.className = 'box'; lastFetchedCallsign = ""; 
        }

        function showFlight(plane, distance) {
            viewIdle.className = 'hidden'; viewFlight.className = 'box';
            
            var rawCallsign = plane.flight ? plane.flight.trim() : '';
            var hexCode = plane.hex ? plane.hex.trim().toUpperCase() : '';
            var callsignText = rawCallsign !== '' ? rawCallsign : hexCode;
            var airlineText = getAirline(rawCallsign);
            
            if (rawCallsign !== '' && rawCallsign !== lastFetchedCallsign) {
                lastFetchedCallsign = rawCallsign;
                routeDisplayEl.innerHTML = '...'; 
                var xhrRoute = new XMLHttpRequest();
                xhrRoute.open('GET', '/api/ruta?callsign=' + encodeURIComponent(rawCallsign), true);
                xhrRoute.onload = function() {
                    if (xhrRoute.status === 200) {
                        try {
                            var rData = JSON.parse(xhrRoute.responseText);
                            if (rData.route && rData.route !== 'N/A') { routeDisplayEl.innerHTML = '| ' + rData.route; } 
                            else { routeDisplayEl.innerHTML = ''; }
                        } catch(e) { routeDisplayEl.innerHTML = ''; }
                    }
                };
                xhrRoute.send();
            } else if (rawCallsign === '') {
                routeDisplayEl.innerHTML = ''; lastFetchedCallsign = '';
            }

            var altFt = plane.alt_baro || plane.alt_geom;
            var alt = '---';
            if (altFt === 'ground') alt = 'On ground';
            else if (altFt !== null && altFt !== undefined) {
                var numericAlt = parseFloat(altFt);
                if (!isNaN(numericAlt)) alt = numericAlt <= 0 ? 'On ground' : Math.round(numericAlt * 0.3048) + ' m';
            }
            var spdKmH = plane.gs ? (plane.gs * 1.852) : null;
            var spd = spdKmH !== null ? Math.round(spdKmH) + ' km/h' : '---';
            
            var etaText = '---';
            if (spdKmH !== null && spdKmH > 20) { 
                var etaMin = (distance / spdKmH) * 60;
                etaText = (etaMin < 1) ? '< 1 min' : Math.round(etaMin) + ' min';
            } else if (spdKmH !== null && spdKmH <= 20) { etaText = 'N/A'; }
            
            airlineEl.innerText = airlineText;
            callsignDisplayEl.innerHTML = '<i class="fa-solid fa-plane"></i> ' + callsignText;
            altEl.innerText = alt; spdEl.innerText = spd;
            distEl.innerText = distance.toFixed(1) + ' km'; etaEl.innerText = etaText;
            trackArrowEl.innerHTML = getDirectionArrowHtml(plane.track);
        }

        fetchRadar(); setInterval(fetchRadar, 15000);

        function checkTrain() {
            var now = new Date();
            var h = now.getUTCHours() - 3;
            var day = now.getUTCDay(); 
            if (h < 0) { h = h + 24; day = day - 1; if (day < 0) day = 6; }
            var m = now.getUTCMinutes();
            
            var isTargetDay = (day === 2 || day === 4); 
            var timeInMinutes = (h * 60) + m;
            var isTargetTime = (timeInMinutes >= 360 && timeInMinutes <= 480); 
            
            var banner = document.getElementById('train-banner');
            
            if (MODO_PRUEBA_TREN || (isTargetDay && isTargetTime)) {
                var schedules = [430, 450, 470]; 
                var nextTrainMins = -1;
                for (var i = 0; i < schedules.length; i++) {
                    if (schedules[i] > timeInMinutes) { nextTrainMins = schedules[i]; break; }
                }
                
                if (nextTrainMins === -1 && !MODO_PRUEBA_TREN) { banner.className = 'hidden'; TREN_ACTIVO = false; updateLayout(); return; }
                if (nextTrainMins === -1 && MODO_PRUEBA_TREN) { nextTrainMins = timeInMinutes + 15; }
                
                banner.className = ''; TREN_ACTIVO = true; updateLayout();
                
                var nextH = Math.floor(nextTrainMins / 60) % 24;
                var nextM = nextTrainMins % 60;
                var timeStr = (nextH < 10 ? '0' + nextH : nextH) + ':' + (nextM < 10 ? '0' + nextM : nextM);

                document.getElementById('train-time').innerHTML = timeStr + ' <span style="font-size: 32px; font-weight: normal; color: #FFF; vertical-align: middle;">| BUSCANDO...</span>';

                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/api/tren', true);
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            var prefix = (data.status === "DEMORADO" || data.status === "CANCELADO") ? "⚠️ " : "";
                            document.getElementById('train-time').innerHTML = timeStr + ' <span style="font-size: 32px; font-weight: normal; color: #FFF; vertical-align: middle;">| ' + prefix + data.status + '</span>';
                        } catch (e) {}
                    }
                };
                xhr.send();
            } else {
                banner.className = 'hidden'; TREN_ACTIVO = false; updateLayout();
            }
        }
        setInterval(checkTrain, 120000); checkTrain();

        // LÓGICA REFINADA DE SPOTIFY (Manual, Automático y Búfer)
        function checkSpotify() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/spotify', true);
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data.title) {
                            lastSpotifyData.title = data.title;
                            lastSpotifyData.artist = data.artist;
                        }
                        lastSpotifyData.isPlaying = data.isPlaying;
                        processSpotifyState();
                    } catch (e) {}
                }
            };
            xhr.send();
        }

        function processSpotifyState() {
            var banner = document.getElementById('spotify-banner');
            document.getElementById('sp-title').innerText = lastSpotifyData.title;
            document.getElementById('sp-artist').innerText = lastSpotifyData.artist;

            if (spotifyForceShow) {
                clearTimeout(spotifyPauseTimer); spotifyPauseTimer = null;
                showSpotifyBanner(true);
            } else if (lastSpotifyData.isPlaying && !TREN_ACTIVO) {
                clearTimeout(spotifyPauseTimer); spotifyPauseTimer = null;
                showSpotifyBanner(true);
            } else {
                if (!banner.classList.contains('hidden') && !spotifyPauseTimer) {
                    spotifyPauseTimer = setTimeout(function() {
                        showSpotifyBanner(false);
                        spotifyPauseTimer = null;
                    }, 30000); 
                }
            }
        }

        function showSpotifyBanner(show) {
            var banner = document.getElementById('spotify-banner');
            if (show) {
                banner.classList.remove('hidden');
                document.getElementById('spotify-toggle').style.color = '#FFF'; 
            } else {
                banner.classList.add('hidden');
                document.getElementById('spotify-toggle').style.color = '#888'; 
            }
            updateLayout();
        }

        function toggleSpotify() {
            spotifyForceShow = !spotifyForceShow;
            processSpotifyState();
        }

        function sendSpCmd(action) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/spotify-control?action=' + action, true);
            xhr.send();
            // Aceleramos la actualización visual del reproductor al tocar
            setTimeout(checkSpotify, 1500);
        }

        setInterval(checkSpotify, 10000); checkSpotify();

    </script>
</body>
</html>
