<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Radar</title>
    <style>
        html { overflow: hidden !important; margin: 0; padding: 0; background: #FFF; }
        
        body {
            width: 720px; 
            height: 580px;
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            color: #000000;
            font-family: sans-serif;
            
            position: absolute;
            top: 0;
            left: 600px;
            -webkit-transform: rotate(90deg);
            -webkit-transform-origin: 0 0;
            
            text-align: center;
            overflow: hidden;
        }
        
        #debug { position: absolute; top: 0; left: 0; font-size: 14px; color: #000; padding: 5px; }
        .hidden { display: none !important; }
        
        .box { padding-top: 30px; box-sizing: border-box; width: 100%; }
        
        .title-container { margin-top: 10px; white-space: nowrap; width: 100%; }
        .huge { font-size: 85px; font-weight: bold; display: inline-block; vertical-align: middle; margin: 0; }
        .arrow { font-size: 70px; display: inline-block; vertical-align: middle; margin-left: 15px; font-weight: normal; }
        
        .big { font-size: 40px; margin: 10px 0 30px 0; }
        
        .data-container { margin-top: 20px; width: 90%; margin-left: 5%; white-space: nowrap; }
        .med { display: inline-block; width: 32%; font-size: 20px; vertical-align: top; color: #333; }
        .med b { font-size: 42px; display: block; margin-top: 5px; color: #000; }

        /* Nuevo diseño para acomodar Reloj y ETA lado a lado */
        .bottom-container { margin-top: 35px; width: 90%; margin-left: 5%; white-space: nowrap; }
        .bottom-item { display: inline-block; width: 48%; vertical-align: top; }
        .bottom-label { font-size: 24px; color: #333; letter-spacing: 2px; }
        .bottom-value { font-size: 80px; font-weight: bold; margin-top: 5px; color: #000; }
    </style>
</head>
<body>
    <div id="debug"></div>
    
    <div id="status-bar" class="big" style="margin-top: 250px;">INITIALIZING...</div>

    <div id="view-clearsky" class="hidden box">
        <div class="huge" style="margin-top: 100px; font-size: 90px;">CLEAR SKY</div>
        <div class="big" style="margin-top: 40px;">Next flight at <span id="next-dist">--</span> km</div>
        
        <!-- Reloj gigante cuando el cielo está despejado -->
        <div class="bottom-container" style="margin-top: 60px;">
            <div class="bottom-label">LOCAL TIME</div>
            <div class="bottom-value clock-display">0000</div>
        </div>
    </div>

    <div id="view-flight" class="hidden box">
        <div class="title-container">
            <span id="callsign" class="huge">✈ ---</span>
            <span id="track-arrow" class="arrow">↑</span>
        </div>
        <div id="airline" class="big">---</div>
        
        <div class="data-container">
            <div class="med">ALTITUDE<b id="alt">--</b></div>
            <div class="med">SPEED<b id="spd">--</b></div>
            <div class="med">DISTANCE<b id="dist">--</b></div>
        </div>

        <!-- Reloj y ETA lado a lado -->
        <div class="bottom-container">
            <div class="bottom-item">
                <div class="bottom-label">LOCAL TIME</div>
                <div class="bottom-value clock-display">0000</div>
            </div>
            <div class="bottom-item">
                <div class="bottom-label">ETA (OVERHEAD)</div>
                <div id="eta" class="bottom-value">--</div>
            </div>
        </div>
    </div>

    <script>
        var USER_LAT = -34.53;
        var USER_LON = -58.49;
        var API_URL = '/api/vuelos';

        var statusBar = document.getElementById('status-bar');
        var viewClearSky = document.getElementById('view-clearsky');
        var viewFlight = document.getElementById('view-flight');
        var debugEl = document.getElementById('debug');

        var nextDistEl = document.getElementById('next-dist');
        var callsignEl = document.getElementById('callsign');
        var airlineEl = document.getElementById('airline');
        var altEl = document.getElementById('alt');
        var spdEl = document.getElementById('spd');
        var distEl = document.getElementById('dist');
        var trackArrowEl = document.getElementById('track-arrow');
        var etaEl = document.getElementById('eta');

        var previousDistances = {};
        var planeStates = {}; 

        var airlines = {
            'ARG': 'Aerolíneas Argentinas',
            'FBZ': 'Flybondi',
            'AVA': 'Avianca',
            'JSM': 'JetSMART',
            'LAN': 'LATAM Airlines',
            'GLO': 'GOL Linhas Aéreas',
            'AAL': 'American Airlines',
            'DAL': 'Delta Air Lines',
            'UAL': 'United Airlines',
            'IBE': 'Iberia',
            'LPE': 'LATAM Perú',
            'DSM': 'LADE',
            'CMP': 'Copa Airlines',
            'AZU': 'Azul Linhas Aéreas',
            'BOV': 'Boliviana de Aviación',
            'SKU': 'Sky Airline'
        };

        // El reloj ahora busca todos los elementos con la clase 'clock-display' y los actualiza
        function updateClock() {
            var d = new Date();
            var h = d.getHours();
            var m = d.getMinutes();
            var timeStr = (h < 10 ? '0' + h : h) + '' + (m < 10 ? '0' + m : m);
            var clocks = document.getElementsByClassName('clock-display');
            for(var i = 0; i < clocks.length; i++) {
                clocks[i].innerText = timeStr;
            }
        }
        setInterval(updateClock, 30000); 
        updateClock();

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            var dLon = (lon2 - lon1) * Math.PI / 180;
            lat1 = lat1 * Math.PI / 180;
            lat2 = lat2 * Math.PI / 180;
            var y = Math.sin(dLon) * Math.cos(lat2);
            var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function getDirectionArrow(degrees) {
            if (degrees === null || degrees === undefined) return '';
            var arrows = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖', '↑'];
            var index = Math.round((degrees % 360) / 45);
            return arrows[index];
        }

        function getAirline(callsign) {
            if (!callsign) return 'UNIDENTIFIED FLIGHT';
            var clean = callsign.trim();
            var code3 = clean.substring(0, 3).toUpperCase();
            return airlines[code3] || 'COMMERCIAL FLIGHT';
        }

        function fetchData() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', API_URL, true);
            
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        statusBar.className = 'hidden'; 
                        debugEl.innerHTML = ''; 
                        
                        if (!data || !data.ac || data.ac.length === 0) {
                            showClearSky('--');
                            return;
                        }

                        var currentDistances = {};
                        var currentStates = {};
                        var closestFlight = null;
                        var minDistance = Infinity;

                        for (var i = 0; i < data.ac.length; i++) {
                            var plane = data.ac[i];
                            if (plane.lat && plane.lon) {
                                var dist = getHaversineDistance(USER_LAT, USER_LON, plane.lat, plane.lon);
                                var planeId = (plane.flight || plane.hex || 'UNK').trim();
                                
                                currentDistances[planeId] = dist;
                                
                                var stateObj = planeStates[planeId] || { phase: 'UNKNOWN', graceTicks: 0 };
                                var isApproaching = false;

                                if (previousDistances[planeId] !== undefined) {
                                    if (dist > previousDistances[planeId] + 0.05) {
                                        if (stateObj.phase === 'APPROACHING') {
                                            stateObj.phase = 'LEAVING';
                                            stateObj.graceTicks = 4;
                                        } else if (stateObj.phase === 'LEAVING') {
                                            if (stateObj.graceTicks > 0) stateObj.graceTicks--;
                                        } else {
                                            stateObj.phase = 'LEAVING';
                                            stateObj.graceTicks = 0;
                                        }
                                    } else if (dist < previousDistances[planeId] - 0.05) {
                                        stateObj.phase = 'APPROACHING';
                                        isApproaching = true;
                                    }
                                } else {
                                    isApproaching = true; 
                                }
                                
                                currentStates[planeId] = stateObj;

                                var isPointingToUs = true;
                                if (plane.track !== null && plane.track !== undefined) {
                                    var bearingToUs = getBearing(plane.lat, plane.lon, USER_LAT, USER_LON);
                                    var headingDiff = Math.abs(bearingToUs - plane.track);
                                    if (headingDiff > 180) headingDiff = 360 - headingDiff;
                                    if (headingDiff > 60) {
                                        isPointingToUs = false;
                                    }
                                }

                                var isEligible = ((isApproaching || stateObj.phase === 'UNKNOWN') && isPointingToUs) || (stateObj.phase === 'LEAVING' && stateObj.graceTicks > 0);

                                if (isEligible && dist < minDistance) {
                                    minDistance = dist;
                                    closestFlight = plane;
                                }
                            }
                        }

                        previousDistances = currentDistances;
                        planeStates = currentStates; 

                        if (closestFlight) {
                            if (minDistance < 20) {
                                showFlight(closestFlight, minDistance);
                            } else {
                                showClearSky(minDistance.toFixed(1));
                            }
                        } else {
                            showClearSky('--');
                        }
                    } catch (e) {
                        debugEl.innerHTML = 'Data error';
                    }
                } else {
                    debugEl.innerHTML = 'Reconnecting...';
                }
            };

            xhr.onerror = function() {
                debugEl.innerHTML = 'Reconnecting...';
            };

            xhr.send();
        }

        function showClearSky(distance) {
            viewFlight.className = 'hidden';
            viewClearSky.className = 'box';
            nextDistEl.innerText = distance;
        }

        function showFlight(plane, distance) {
            viewClearSky.className = 'hidden';
            viewFlight.className = 'box';

            var callsign = (plane.flight || '---').trim();
            
            var altFt = plane.alt_baro || plane.alt_geom;
            var alt = '---';
            if (altFt === 'ground') {
                alt = 'On ground';
            } else if (altFt !== null && altFt !== undefined) {
                var numericAlt = parseFloat(altFt);
                if (!isNaN(numericAlt)) {
                    alt = numericAlt <= 0 ? 'On ground' : Math.round(numericAlt * 0.3048) + ' m';
                }
            }

            var spdKmH = plane.gs ? (plane.gs * 1.852) : null;
            var spd = spdKmH !== null ? Math.round(spdKmH) + ' km/h' : '---';
            
            var etaText = '---';
            if (spdKmH !== null && spdKmH > 20) { 
                var etaMin = (distance / spdKmH) * 60;
                if (etaMin < 1) {
                    etaText = '< 1 min';
                } else {
                    etaText = Math.round(etaMin) + ' min';
                }
            } else if (spdKmH !== null && spdKmH <= 20) {
                etaText = 'N/A';
            }

            var track = plane.track;

            callsignEl.innerText = '✈ ' + callsign;
            airlineEl.innerText = getAirline(callsign);
            altEl.innerText = alt;
            spdEl.innerText = spd;
            distEl.innerText = distance.toFixed(1) + ' km';
            etaEl.innerText = etaText;
            trackArrowEl.innerText = getDirectionArrow(track);
        }

        fetchData();
        setInterval(fetchData, 15000);
    </script>
</body>
</html>
