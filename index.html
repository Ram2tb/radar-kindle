<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Radar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html { overflow: hidden !important; margin: 0; padding: 0; background: #FFF; }
        body {
            width: 720px; 
            height: 580px;
            margin: 0; padding: 0;
            background-color: #FFFFFF; color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            position: absolute; top: 0; left: 600px;
            -webkit-transform: rotate(90deg); -webkit-transform-origin: 0 0;
            text-align: center; overflow: hidden;
        }
        #debug { position: absolute; top: 0; left: 0; font-size: 14px; color: #000; padding: 5px; z-index: 10; }
        .hidden { display: none !important; }
        .box { padding-top: 30px; box-sizing: border-box; width: 100%; }
        .title-container { margin-top: 10px; white-space: nowrap; width: 100%; }
        .huge { font-size: 80px; font-weight: bold; display: inline-block; vertical-align: middle; margin: 0; }
        .huge i { font-size: 65px; margin-right: 15px; vertical-align: middle; }
        .arrow { font-size: 65px; display: inline-block; vertical-align: middle; margin-left: 15px; }
        .big { font-size: 38px; margin: 10px 0 25px 0; font-weight: bold; }
        .data-container { margin-top: 20px; width: 94%; margin-left: 3%; white-space: nowrap; }
        .med { display: inline-block; width: 31%; font-size: 18px; vertical-align: top; color: #333; font-weight: bold; }
        .med b { font-size: 38px; display: block; margin-top: 5px; color: #000; }
        .med-sep { display: inline-block; width: 2%; font-size: 30px; color: #ccc; vertical-align: middle; }
        .bottom-container { margin-top: 35px; width: 94%; margin-left: 3%; white-space: nowrap; border-top: 2px solid #000; padding-top: 15px; }
        .bottom-item { display: inline-block; width: 48%; vertical-align: top; }
        .bottom-label { font-size: 22px; color: #333; letter-spacing: 2px; font-weight: bold; }
        .bottom-value { font-size: 58px; font-weight: bold; margin-top: 5px; color: #000; }
        .weather-display { font-weight: normal; margin-left: 5px; color: #333; }
        .weather-display i { font-size: 48px; vertical-align: middle; }
    </style>
</head>
<body>
    <div id="debug"></div>
    <div id="status-bar" class="big" style="margin-top: 250px;">INITIALIZING...</div>

    <!-- PANTALLA CIELO DESPEJADO -->
    <div id="view-clearsky" class="hidden box">
        <div class="huge" style="margin-top: 80px; font-size: 85px;">CLEAR SKY</div>
        <div class="big" style="margin-top: 40px;">Next flight at <span id="next-dist">--</span> km</div>
        
        <div class="bottom-container" style="margin-top: 80px; border-top: none;">
            <div class="bottom-label">LOCAL TIME & WX</div>
            <div class="bottom-value" style="font-size: 75px;">
                <span class="clock-display">00:00</span><span class="weather-display" id="wx-clear"></span>
            </div>
        </div>
    </div>

    <!-- PANTALLA VUELO DETECTADO -->
    <div id="view-flight" class="hidden box">
        <div class="title-container">
            <span id="callsign" class="huge"><i class="fa-solid fa-plane"></i>---</span>
            <span id="track-arrow" class="arrow"><i class="fa-solid fa-arrow-up"></i></span>
        </div>
        <div id="airline" class="big">---</div>
        
        <div class="data-container">
            <div class="med">ALTITUDE<b id="alt">--</b></div>
            <span class="med-sep">|</span>
            <div class="med">SPEED<b id="spd">--</b></div>
            <span class="med-sep">|</span>
            <div class="med">DISTANCE<b id="dist">--</b></div>
        </div>

        <div class="bottom-container">
            <div class="bottom-item">
                <div class="bottom-label">LOCAL & WX</div>
                <div class="bottom-value">
                    <span class="clock-display">00:00</span><span class="weather-display" id="wx-flight"></span>
                </div>
            </div>
            <div class="bottom-item">
                <div class="bottom-label">ETA (OVERHEAD)</div>
                <div id="eta" class="bottom-value">--</div>
            </div>
        </div>
    </div>

    <!-- BANNER DINÁMICO TREN DE LA COSTA -->
    <div id="train-banner" class="hidden" style="position: absolute; bottom: 0; left: 0; width: 100%; background: #000; color: #FFF; padding: 15px 0; border-top: 4px solid #333; z-index: 100;">
        <div style="font-size: 22px; font-weight: bold; letter-spacing: 2px; color: #CCC;">
            <i class="fa-solid fa-train-tram"></i> PRÓXIMO TREN A DELTA
        </div>
        <div style="font-size: 65px; font-weight: bold; margin-top: 5px;" id="train-time">
            ESTADO: <span id="train-status-text" style="font-size: 55px; font-weight: normal; color: #FFF; vertical-align: middle;">BUSCANDO...</span>
        </div>
    </div>

    <script>
        // ==========================================
        // LLAVE MAESTRA: Ponelo en 'false' para que 
        // solo funcione los Mar y Jue de 06:00 a 08:00
        // ==========================================
        var MODO_PRUEBA_TREN = true;

        var USER_LAT = -34.53;
        var USER_LON = -58.49;
        
        var RADAR_API_URL = '/api/vuelos';
        var WEATHER_API_URL = 'https://api.open-meteo.com/v1/forecast?latitude=' + USER_LAT + '&longitude=' + USER_LON + '&current_weather=true';

        var statusBar = document.getElementById('status-bar');
        var viewClearSky = document.getElementById('view-clearsky');
        var viewFlight = document.getElementById('view-flight');
        var debugEl = document.getElementById('debug');

        var nextDistEl = document.getElementById('next-dist');
        var callsignEl = document.getElementById('callsign');
        var airlineEl = document.getElementById('airline');
        var altEl = document.getElementById('alt');
        var spdEl = document.getElementById('spd');
        var distEl = document.getElementById('dist');
        var trackArrowEl = document.getElementById('track-arrow');
        var etaEl = document.getElementById('eta');

        var previousDistances = {};
        var planeStates = {}; 

        var airlines = {
            'ARG': 'Aerolíneas Argentinas', 'FBZ': 'Flybondi', 'AVA': 'Avianca',
            'JSM': 'JetSMART', 'LAN': 'LATAM Airlines', 'GLO': 'GOL Linhas Aéreas',
            'AAL': 'American Airlines', 'DAL': 'Delta Air Lines', 'UAL': 'United Airlines',
            'IBE': 'Iberia', 'LPE': 'LATAM Perú', 'DSM': 'LADE', 'CMP': 'Copa Airlines',
            'AZU': 'Azul Linhas Aéreas', 'BOV': 'Boliviana de Aviación', 'SKU': 'Sky Airline'
        };

        function updateClock() {
            var d = new Date();
            var h = d.getUTCHours() - 3;
            if (h < 0) h = h + 24;
            var m = d.getUTCMinutes();
            var timeStr = (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
            var clocks = document.getElementsByClassName('clock-display');
            for(var i = 0; i < clocks.length; i++) {
                clocks[i].innerText = timeStr;
            }
        }
        setInterval(updateClock, 30000); 
        updateClock();

        function getWeatherIconHtml(code) {
            if (code === 0) return '<i class="fa-solid fa-sun"></i>';
            if (code >= 1 && code <= 3) return '<i class="fa-solid fa-cloud"></i>';
            if (code === 45 || code === 48) return '<i class="fa-solid fa-smog"></i>';
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return '<i class="fa-solid fa-cloud-rain"></i>';
            if ((code >= 71 && code <= 77) || code === 85 || code === 86) return '<i class="fa-solid fa-snowflake"></i>';
            if (code >= 95 && code <= 99) return '<i class="fa-solid fa-cloud-bolt"></i>';
            return '<i class="fa-solid fa-cloud-sun"></i>';
        }

        function fetchWeather() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', WEATHER_API_URL, true);
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        var temp = Math.round(data.current_weather.temperature);
                        var iconHtml = getWeatherIconHtml(data.current_weather.weathercode);
                        var weatherHtml = ' ' + iconHtml + ' ' + temp + '°';
                        document.getElementById('wx-clear').innerHTML = weatherHtml;
                        document.getElementById('wx-flight').innerHTML = weatherHtml;
                    } catch (e) {}
                }
            };
            xhr.send();
        }
        fetchWeather();
        setInterval(fetchWeather, 1800000);

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            var dLon = (lon2 - lon1) * Math.PI / 180;
            lat1 = lat1 * Math.PI / 180; lat2 = lat2 * Math.PI / 180;
            var y = Math.sin(dLon) * Math.cos(lat2);
            var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function getDirectionArrowHtml(degrees) {
            if (degrees === null || degrees === undefined) return '<i class="fa-solid fa-arrow-up"></i>';
            var rounded = Math.round((degrees % 360) / 45) * 45;
            return '<i class="fa-solid fa-arrow-up fa-rotate-' + rounded + '"></i>';
        }

        function getAirline(callsign) {
            if (!callsign) return 'UNIDENTIFIED FLIGHT';
            var clean = callsign.trim();
            return airlines[clean.substring(0, 3).toUpperCase()] || 'COMMERCIAL FLIGHT';
        }

        function fetchRadar() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', RADAR_API_URL, true);
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        statusBar.className = 'hidden'; 
                        debugEl.innerHTML = ''; 
                        if (!data || !data.ac || data.ac.length === 0) {
                            showClearSky('--'); return;
                        }
                        var currentDistances = {}, currentStates = {}, closestFlight = null, minDistance = Infinity;
                        for (var i = 0; i < data.ac.length; i++) {
                            var plane = data.ac[i];
                            if (plane.lat && plane.lon) {
                                var dist = getHaversineDistance(USER_LAT, USER_LON, plane.lat, plane.lon);
                                var planeId = (plane.flight || plane.hex || 'UNK').trim();
                                currentDistances[planeId] = dist;
                                var stateObj = planeStates[planeId] || { phase: 'UNKNOWN', graceTicks: 0 };
                                var isApproaching = false;
                                if (previousDistances[planeId] !== undefined) {
                                    if (dist > previousDistances[planeId] + 0.05) {
                                        if (stateObj.phase === 'APPROACHING') { stateObj.phase = 'LEAVING'; stateObj.graceTicks = 4; }
                                        else if (stateObj.phase === 'LEAVING') { if (stateObj.graceTicks > 0) stateObj.graceTicks--; }
                                        else { stateObj.phase = 'LEAVING'; stateObj.graceTicks = 0; }
                                    } else if (dist < previousDistances[planeId] - 0.05) {
                                        stateObj.phase = 'APPROACHING'; isApproaching = true;
                                    }
                                } else { isApproaching = true; }
                                currentStates[planeId] = stateObj;
                                var isPointingToUs = true;
                                if (plane.track !== null && plane.track !== undefined) {
                                    var bearingToUs = getBearing(plane.lat, plane.lon, USER_LAT, USER_LON);
                                    var headingDiff = Math.abs(bearingToUs - plane.track);
                                    if (headingDiff > 180) headingDiff = 360 - headingDiff;
                                    if (headingDiff > 60) isPointingToUs = false;
                                }
                                var isEligible = ((isApproaching || stateObj.phase === 'UNKNOWN') && isPointingToUs) || (stateObj.phase === 'LEAVING' && stateObj.graceTicks > 0);
                                if (isEligible && dist < minDistance) {
                                    minDistance = dist; closestFlight = plane;
                                }
                            }
                        }
                        previousDistances = currentDistances; planeStates = currentStates; 
                        if (closestFlight) {
                            if (minDistance < 20) showFlight(closestFlight, minDistance);
                            else showClearSky(minDistance.toFixed(1));
                        } else {
                            showClearSky('--');
                        }
                    } catch (e) {
                        debugEl.innerHTML = 'Data error';
                    }
                } else {
                    debugEl.innerHTML = 'Reconnecting...';
                }
            };
            xhr.onerror = function() { debugEl.innerHTML = 'Reconnecting...'; };
            xhr.send();
        }

        function showClearSky(distance) {
            viewFlight.className = 'hidden'; viewClearSky.className = 'box'; nextDistEl.innerText = distance;
        }

        function showFlight(plane, distance) {
            viewClearSky.className = 'hidden'; viewFlight.className = 'box';
            var callsign = (plane.flight || '---').trim();
            var altFt = plane.alt_baro || plane.alt_geom;
            var alt = '---';
            if (altFt === 'ground') alt = 'On ground';
            else if (altFt !== null && altFt !== undefined) {
                var numericAlt = parseFloat(altFt);
                if (!isNaN(numericAlt)) alt = numericAlt <= 0 ? 'On ground' : Math.round(numericAlt * 0.3048) + ' m';
            }
            var spdKmH = plane.gs ? (plane.gs * 1.852) : null;
            var spd = spdKmH !== null ? Math.round(spdKmH) + ' km/h' : '---';
            var etaText = '---';
            if (spdKmH !== null && spdKmH > 20) { 
                var etaMin = (distance / spdKmH) * 60;
                etaText = (etaMin < 1) ? '< 1 min' : Math.round(etaMin) + ' min';
            } else if (spdKmH !== null && spdKmH <= 20) { etaText = 'N/A'; }
            callsignEl.innerHTML = '<i class="fa-solid fa-plane"></i> ' + callsign;
            airlineEl.innerText = getAirline(callsign); altEl.innerText = alt; spdEl.innerText = spd;
            distEl.innerText = distance.toFixed(1) + ' km'; etaEl.innerText = etaText;
            trackArrowEl.innerHTML = getDirectionArrowHtml(plane.track);
        }

        fetchRadar(); setInterval(fetchRadar, 15000);

        // --- MONITOR TREN DE LA COSTA EN TIEMPO REAL ---
        function checkTrain() {
            var now = new Date();
            var h = now.getUTCHours() - 3;
            var day = now.getUTCDay(); 
            if (h < 0) { h = h + 24; day = day - 1; if (day < 0) day = 6; }
            var m = now.getUTCMinutes();
            
            var isTargetDay = (day === 2 || day === 4); 
            var timeInMinutes = (h * 60) + m;
            // Configurado para chequear entre las 06:00 y las 08:00
            var isTargetTime = (timeInMinutes >= 360 && timeInMinutes <= 480); 
            
            var banner = document.getElementById('train-banner');
            
            if (MODO_PRUEBA_TREN || (isTargetDay && isTargetTime)) {
                banner.className = ''; 
                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/api/tren', true);
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            var color = "#4CAF50"; 
                            if (data.status === "DEMORADO") color = "#FF9800"; 
                            if (data.status === "CANCELADO" || data.status === "SIN SEÑAL") color = "#F44336"; 
                            var statusEl = document.getElementById('train-status-text');
                            statusEl.innerText = data.status;
                            statusEl.style.color = color;
                        } catch (e) {}
                    } else {
                        // Si da error 404 porque todavía Vercel no actualizó la carpeta api
                        document.getElementById('train-status-text').innerText = 'API PENDIENTE';
                        document.getElementById('train-status-text').style.color = '#FF9800';
                    }
                };
                xhr.onerror = function() {
                    document.getElementById('train-status-text').innerText = 'ERROR DE RED';
                }
                xhr.send();
            } else {
                banner.className = 'hidden'; 
            }
        }
        setInterval(checkTrain, 120000); 
        checkTrain();

    </script>
</body>
</html>
