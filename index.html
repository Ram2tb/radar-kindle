<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Radar</title>
    <style>
        body {
            /* Resolución exacta del Kindle 8va Gen acostado */
            width: 800px;
            height: 600px;
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            color: #000000;
            font-family: sans-serif;
            
            /* Rotación a prueba de tontos */
            position: absolute;
            top: 0;
            left: 600px;
            -webkit-transform: rotate(90deg);
            -webkit-transform-origin: 0 0;
            
            text-align: center;
            overflow: hidden;
        }
        
        #debug { font-size: 20px; color: #000; padding: 10px; }
        .hidden { display: none !important; }
        
        .box { padding-top: 80px; }
        .huge { font-size: 100px; font-weight: bold; margin-bottom: 20px; }
        .big { font-size: 45px; }
        
        .data-container { margin-top: 50px; }
        .med { font-size: 30px; margin: 0 30px; display: inline-block; vertical-align: top; }
        .med b { font-size: 50px; display: block; margin-top: 10px; }
        
        .arrow { font-size: 120px; margin-top: 30px; line-height: 1; }
    </style>
</head>
<body>
    <!-- Consola de errores visible por si falla algo -->
    <div id="debug"></div>
    
    <div id="status-bar" class="big" style="margin-top: 200px;">INICIANDO...</div>

    <div id="view-clearsky" class="hidden box">
        <div class="huge">CIELO<br>DESPEJADO</div>
        <div class="big" style="margin-top:60px">Próximo a <span id="next-dist">--</span> km</div>
    </div>

    <div id="view-flight" class="hidden box">
        <div id="callsign" class="huge">---</div>
        <div id="airline" class="big">---</div>
        <div class="data-container">
            <div class="med">ALTITUD<b id="alt">--</b></div>
            <div class="med">VELOCIDAD<b id="spd">--</b></div>
            <div class="med">DISTANCIA<b id="dist">--</b></div>
        </div>
        <div id="track-arrow" class="arrow">↑</div>
    </div>

    <script>
        // Detector de errores que imprime el fallo en la pantalla del Kindle
        window.onerror = function(msg, url, line) {
            document.getElementById('debug').innerHTML = 'Error JS: ' + msg + ' (L: ' + line + ')';
            return false;
        };

        var USER_LAT = -34.53;
        var USER_LON = -58.49;
        var API_URL = '/api/vuelos';

        var statusBar = document.getElementById('status-bar');
        var viewClearSky = document.getElementById('view-clearsky');
        var viewFlight = document.getElementById('view-flight');

        var nextDistEl = document.getElementById('next-dist');
        var callsignEl = document.getElementById('callsign');
        var airlineEl = document.getElementById('airline');
        var altEl = document.getElementById('alt');
        var spdEl = document.getElementById('spd');
        var distEl = document.getElementById('dist');
        var trackArrowEl = document.getElementById('track-arrow');

        var airlines = {
            'ARG': 'Aerolíneas Argentinas',
            'FBZ': 'Flybondi',
            'AVA': 'Avianca',
            'JSM': 'JetSMART',
            'LAN': 'LATAM Airlines',
            'GLO': 'GOL Linhas Aéreas',
            'AAL': 'American Airlines',
            'DAL': 'Delta Air Lines',
            'UAL': 'United Airlines',
            'IBE': 'Iberia',
            'LPE': 'LATAM Perú',
            'DSM': 'LADE',
            'CMP': 'Copa Airlines',
            'AZU': 'Azul Linhas Aéreas',
            'BOV': 'Boliviana de Aviación',
            'SKU': 'Sky Airline'
        };

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function getDirectionArrow(degrees) {
            if (degrees === null || degrees === undefined) return '';
            var arrows = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖', '↑'];
            var index = Math.round((degrees % 360) / 45);
            return arrows[index];
        }

        function getAirline(callsign) {
            if (!callsign) return 'VUELO NO IDENTIFICADO';
            var clean = callsign.trim();
            var code3 = clean.substring(0, 3).toUpperCase();
            return airlines[code3] || 'VUELO COMERCIAL';
        }

        function fetchData() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', API_URL, true);
            
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        statusBar.className = 'hidden'; // Ocultamos el INICIANDO
                        
                        if (!data || !data.ac || data.ac.length === 0) {
                            showClearSky('--');
                            return;
                        }

                        var closestFlight = null;
                        var minDistance = Infinity;

                        for (var i = 0; i < data.ac.length; i++) {
                            var plane = data.ac[i];
                            if (plane.lat && plane.lon) {
                                var dist = getHaversineDistance(USER_LAT, USER_LON, plane.lat, plane.lon);
                                if (dist < minDistance) {
                                    minDistance = dist;
                                    closestFlight = plane;
                                }
                            }
                        }

                        if (closestFlight) {
                            if (minDistance < 20) {
                                showFlight(closestFlight, minDistance);
                            } else {
                                showClearSky(minDistance.toFixed(1));
                            }
                        } else {
                            showClearSky('--');
                        }
                    } catch (e) {
                        document.getElementById('debug').innerHTML = 'Error parseando datos';
                    }
                } else {
                    document.getElementById('debug').innerHTML = 'Reconectando...';
                }
            };

            xhr.onerror = function() {
                document.getElementById('debug').innerHTML = 'Sin conexión al radar';
            };

            xhr.send();
        }

        function showClearSky(distance) {
            viewFlight.className = 'hidden';
            viewClearSky.className = 'box';
            nextDistEl.innerText = distance;
        }

        function showFlight(plane, distance) {
            viewClearSky.className = 'hidden';
            viewFlight.className = 'box';

            var callsign = (plane.flight || '---').trim();
            var altFt = plane.alt_baro || plane.alt_geom;
            var alt = altFt ? (altFt <= 0 ? 'En tierra' : Math.round(altFt * 0.3048) + ' m') : '---';
            var spd = plane.gs ? Math.round(plane.gs * 1.852) + ' km/h' : '---';
            var track = plane.track;

            callsignEl.innerText = callsign;
            airlineEl.innerText = getAirline(callsign);
            altEl.innerText = alt;
            spdEl.innerText = spd;
            distEl.innerText = distance.toFixed(1) + ' km';
            trackArrowEl.innerText = getDirectionArrow(track);
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
